<main class="page"><h1>Araç Listesi</h1><input [(ngModel)]="search" (input)="getir()" placeholder="Marka veya model ara..."/><div class="table-wrap"><table><thead><tr><th>Görsel</th><th>Marka</th><th>Model</th><th>Yıl</th><th>Fiyat</th></tr></thead><tbody>@for(arac of araclar();track arac.id){<tr><td>@if(arac.gorselUrl){<img [src]="arac.gorselUrl" [alt]="arac.marka+' '+arac.model"/>}@else{—}</td><td>{{arac.marka}}</td><td>{{arac.model}}</td><td>{{arac.yil}}</td><td>{{arac.fiyat|number}} ₺</td></tr>}@if(araclar().length===0){<tr><td colspan="5">Henüz araç kaydı bulunmuyor.</td></tr>}</tbody></table></div></main>
