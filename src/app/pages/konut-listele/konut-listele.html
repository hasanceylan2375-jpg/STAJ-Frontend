<main class="page"><h1>Konut Listesi</h1><input [(ngModel)]="search" (input)="getir()" placeholder="Konut veya konum ara..."/><div class="table-wrap"><table><thead><tr><th>Görsel</th><th>Konut</th><th>Konum</th><th>Oda</th><th>Fiyat</th></tr></thead><tbody>@for(konut of konutlar();track konut.id){<tr><td>@if(konut.gorselUrl){<img [src]="konut.gorselUrl" [alt]="konut.baslik"/>}@else{—}</td><td>{{konut.baslik}}</td><td>{{konut.konum||'—'}}</td><td>{{konut.odaSayisi}}</td><td>{{konut.fiyat|number}} ₺</td></tr>}@if(konutlar().length===0){<tr><td colspan="5">Henüz konut kaydı bulunmuyor.</td></tr>}</tbody></table></div></main>
