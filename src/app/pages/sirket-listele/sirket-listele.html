<main class="page">
  <h1>Şirket Listesi</h1>
  <input [(ngModel)]="search" (input)="getir()" placeholder="Şirket ara..." />
  <div class="table-wrap">
    <table>
      <thead><tr><th>Logo</th><th>Şirket</th><th>Sektör</th><th>E-posta</th><th>Telefon</th></tr></thead>
      <tbody>
        @for (sirket of sirketler(); track sirket.id) {
          <tr>
            <td>@if (sirket.logoUrl) { <img [src]="sirket.logoUrl" [alt]="sirket.ad" /> } @else { — }</td>
            <td>{{ sirket.ad }}</td><td>{{ sirket.sektor || '—' }}</td><td>{{ sirket.email || '—' }}</td><td>{{ sirket.telefon || '—' }}</td>
          </tr>
        }
        @if (sirketler().length === 0) { <tr><td colspan="5">Henüz şirket kaydı bulunmuyor.</td></tr> }
      </tbody>
    </table>
  </div>
</main>
