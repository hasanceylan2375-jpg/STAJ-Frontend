<div class="mail-container"><div class="mail-card"><div class="mail-header"><div class="mail-icon">✉</div><div><h1>Mail Gönder</h1><p>Alıcı bilgilerini girerek sistem üzerinden hızlıca mail gönderebilirsin.</p></div></div><form (ngSubmit)="send()"><div class="form-group"><label for="to">Alıcı E-posta</label><input id="to" type="email" name="to" [(ngModel)]="to" placeholder="ornek@email.com" required></div><div class="form-group"><label for="subject">Konu</label><input id="subject" type="text" name="subject" [(ngModel)]="subject" placeholder="Mail konusunu yazın" required></div><div class="form-group"><label for="body">Mesaj</label><textarea id="body" name="body" rows="8" [(ngModel)]="body" placeholder="Mesajınızı buraya yazın..." required></textarea></div><div class="form-footer"><span class="info-text">📨 Mail, sistem üzerinden güvenli şekilde gönderilir.</span><button type="submit"><span>✉ Mail Gönder</span></button></div></form>@if (message) {<p class="message">{{ message }}</p>}</div></div>
