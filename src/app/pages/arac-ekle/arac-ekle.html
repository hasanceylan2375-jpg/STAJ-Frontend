<h2>Araç Ekle</h2><form (ngSubmit)="kaydet()" #f="ngForm"><label>Marka</label><input [(ngModel)]="marka" name="marka" required><label>Model</label><input [(ngModel)]="model" name="model" required><label>Yıl</label><input type="number" [(ngModel)]="yil" name="yil" required><label>Fiyat</label><input type="number" [(ngModel)]="fiyat" name="fiyat" required><label>Görsel Dosyası</label><input type="file" name="gorsel" accept=".jpg,.jpeg,.png,.webp,.svg" (change)="dosyaSecildi($event)"><small>JPG, JPEG, PNG, WebP veya SVG; en fazla 5 MB.</small>@if(hata){<p class="hata">{{hata}}</p>}<button [disabled]="!f.valid || yukleniyor">{{yukleniyor?'Kaydediliyor...':'Kaydet'}}</button></form>
