<h2>Araç Ekle</h2><form (ngSubmit)="kaydet()" #f="ngForm"><label>Marka</label><input [(ngModel)]="marka" name="marka" required><label>Model</label><input [(ngModel)]="model" name="model" required><label>Yıl</label><input type="number" [(ngModel)]="yil" name="yil" required><label>Fiyat</label><input type="number" [(ngModel)]="fiyat" name="fiyat" required><label>Görsel URL (JPG, PNG, WebP veya SVG)</label><input [(ngModel)]="gorselUrl" name="gorselUrl" placeholder="https://.../gorsel.webp"><small>Öneri: Fotoğraflarda WebP/JPG, logo ve ikonlarda SVG/PNG kullanın.</small>@if(hata){<p class="hata">{{hata}}</p>}<button [disabled]="!f.valid">Kaydet</button></form>
