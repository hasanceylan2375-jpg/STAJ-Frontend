<h2>Konut Ekle</h2><form (ngSubmit)="kaydet()" #f="ngForm"><label>Konut Başlığı</label><input [(ngModel)]="baslik" name="baslik" required><label>Konum</label><input [(ngModel)]="konum" name="konum"><label>Oda Sayısı</label><input type="number" [(ngModel)]="odaSayisi" name="odaSayisi" required><label>Fiyat</label><input type="number" [(ngModel)]="fiyat" name="fiyat" required><label>Görsel URL (JPG, PNG, WebP veya SVG)</label><input [(ngModel)]="gorselUrl" name="gorselUrl" placeholder="https://.../konut.webp"><small>Öneri: Fotoğraflarda WebP/JPG, logo ve ikonlarda SVG/PNG kullanın.</small>@if(hata){<p class="hata">{{hata}}</p>}<button [disabled]="!f.valid">Kaydet</button></form>
