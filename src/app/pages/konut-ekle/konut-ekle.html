<h2>Konut Ekle</h2><form (ngSubmit)="kaydet()" #f="ngForm"><label>Başlık</label><input [(ngModel)]="baslik" name="baslik" required><label>Konum</label><input [(ngModel)]="konum" name="konum"><label>Oda Sayısı</label><input type="number" [(ngModel)]="odaSayisi" name="odaSayisi" required><label>Fiyat</label><input type="number" [(ngModel)]="fiyat" name="fiyat" required><label>Görsel Dosyası</label><input type="file" name="gorsel" accept=".jpg,.jpeg,.png,.webp,.svg" (change)="dosyaSecildi($event)"><small>JPG, JPEG, PNG, WebP veya SVG; en fazla 5 MB.</small>@if(hata){<p class="hata">{{hata}}</p>}<button [disabled]="!f.valid || yukleniyor">{{yukleniyor?'Kaydediliyor...':'Kaydet'}}</button></form>
