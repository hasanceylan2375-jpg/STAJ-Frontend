<h2>Şirket Ekle</h2><form (ngSubmit)="kaydet()" #f="ngForm"><label>Şirket Adı</label><input [(ngModel)]="ad" name="ad" required><label>Sektör</label><input [(ngModel)]="sektor" name="sektor"><label>E-posta</label><input type="email" [(ngModel)]="email" name="email"><label>Telefon</label><input [(ngModel)]="telefon" name="telefon"><label>Logo URL (isteğe bağlı)</label><input [(ngModel)]="logoUrl" name="logoUrl"><button [disabled]="!f.valid">Kaydet</button></form>
