<h2>Şirket Ekle</h2><form (ngSubmit)="kaydet()" #f="ngForm"><label>Şirket Adı</label><input [(ngModel)]="ad" name="ad" required><label>Sektör</label><input [(ngModel)]="sektor" name="sektor"><label>E-posta</label><input type="email" [(ngModel)]="email" name="email"><label>Telefon</label><input [(ngModel)]="telefon" name="telefon"><label>Şirket Logosu</label><input type="file" name="logo" accept=".jpg,.jpeg,.png,.webp,.svg" (change)="dosyaSecildi($event)"><small>JPG, JPEG, PNG, WebP veya SVG; en fazla 5 MB.</small>@if(hata){<p class="hata">{{hata}}</p>}<button type="submit" [disabled]="!f.valid || yukleniyor">{{yukleniyor?'Kaydediliyor...':'Kaydet'}}</button></form>
