<h2>Şirket Ekle</h2><form (ngSubmit)="kaydet()" #f="ngForm"><label>Şirket Adı</label><input [(ngModel)]="ad" name="ad" required><label>Sektör</label><input [(ngModel)]="sektor" name="sektor"><label>E-posta</label><input type="email" [(ngModel)]="email" name="email"><label>Telefon</label><input [(ngModel)]="telefon" name="telefon"><label>Logo URL (JPG, PNG, WebP veya SVG)</label><input [(ngModel)]="logoUrl" name="logoUrl" placeholder="https://.../logo.svg"><small>Öneri: Logo ve ikonlarda SVG/PNG, fotoğraflarda WebP/JPG kullanın.</small>@if(hata){<p class="hata">{{hata}}</p>}<button [disabled]="!f.valid">Kaydet</button></form>
