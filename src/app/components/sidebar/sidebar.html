<div class="sidebar">
  <h2>Müşteri Yönetimi</h2>

  <div class="language-selector">
    <button type="button" [class.active-language]="selectedLanguage === 'tr-TR'" (click)="setLanguage('tr-TR')">🇹🇷 Türkçe</button>
    <button type="button" [class.active-language]="selectedLanguage === 'en-US'" (click)="setLanguage('en-US')">🇬🇧 English</button>
  </div>

  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">⌂&nbsp; Ana Sayfa</a>
  <a routerLink="/login" routerLinkActive="active">⇥&nbsp; Giriş Yap</a>
  <a routerLink="/musteri-ekle" routerLinkActive="active">＋&nbsp; Müşteri Ekle</a>
  <a routerLink="/musteri-listele" routerLinkActive="active">▤&nbsp; Müşteri Listele</a>
  <a routerLink="/about" routerLinkActive="active">◎&nbsp; Hakkımızda</a>
  <a routerLink="/contact" routerLinkActive="active">✉&nbsp; İletişim</a>
  <a routerLink="/features" routerLinkActive="active">✦&nbsp; Özellikler</a>
  <a routerLink="/faq" routerLinkActive="active">?&nbsp; SSS</a>
  <a routerLink="/profile" routerLinkActive="active">♙&nbsp; Profilim</a>

  <button type="button" class="logout-btn" (click)="logout()">⇥&nbsp; Çıkış Yap</button>
</div>

@if (showLogoutMessage) {
  <div class="logout-overlay">
    <div class="logout-message">✓ Çıkış yapıldı</div>
  </div>
}
